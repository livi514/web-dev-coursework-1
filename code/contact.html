    <div class="page-wrapper">
         <h1>Contact Us!</h1>
        <form>
            <h4>Name:</h4>
            <input type="text"
                placeholder="Enter your full name"
                maxlength="100"
                pattern="[A-Za-z\s]+"
                required>
            <h4>Email:</h4>
            <input type="email"
                placeholder="Enter your email address"
                maxlength="255"
                required>
            <h4>Message:</h4>
            <textarea placeholder="Type your message here"
                    maxlength="1000"
                    required></textarea>
            <br>
            <input class="submit-button" type="submit" value="Send Message">
        </form>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2525.0728943314584!2d-3.5377224228762545!3d50.73713687164844!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x486da4113c8130b1%3A0x7f3efd04b3287246!2sUniversity%20of%20Exeter!5e0!3m2!1sen!2suk!4v1770376468851!5m2!1sen!2suk" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
